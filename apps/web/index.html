<!doctype html>
<!-- The pre-paint background lives on <html>, not on <body>, and that is not a
     tidy-up. The theme script runs in <head>, where <body> does not exist yet,
     so <body> is the one element it cannot correct; leaving the colour there
     meant Tabletop painted Arcade's plum over its own walnut for the width of
     the body box. On <html> the script can set it, and the canvas takes its
     background from <html> anyway. -->
<html lang="en" style="background:#17111f">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Arcade's --gn-bg, spelled out, and overwritten by the script below when
         the stored theme is not Arcade. This and the body background are the
         only two colours in the app that CANNOT be tokens: both are read before
         the stylesheet exists, which is the whole reason they are here. -->
    <meta name="theme-color" content="#17111f" />
    <!-- THEME, BEFORE FIRST PAINT.
         Reads the same key as src/useTheme.ts and sets the attribute now,
         inline and render-blocking, because the alternative is painting Arcade
         and then flipping to the real theme once the bundle has parsed. On a
         phone that flash reads as a bug, not as a preference being applied.
         Same class of problem as the cached Me object: state that is correct
         but arrives after the first paint is still a flash.

         IT MUST FAIL SOFT. This runs before React, so anything thrown here
         takes the whole app down rather than degrading one control. Storage
         throws outright in Safari private mode, so the try/catch is load
         bearing, and falling through leaves the attribute unset, which is
         Arcade, which is the default anyway.

         THE ATTRIBUTE IS SHAPE-CHECKED, THE COLOURS ARE LOOKED UP. An
         unrecognised theme name selects no token block and therefore renders
         Arcade, so setting it is harmless and a rollback keeps the preference
         (see readTheme in useTheme.ts). But the two pre-paint colours have to
         come from somewhere, so GN_BG below is a real map, and a name that is
         not in it falls back to Arcade's rather than painting nothing.
         apps/server/tests/theme-contrast.test.ts fails the build if a theme in
         index.css has no entry here, because "add a theme, forget the pre-paint
         map" is a flash nobody would notice in review. -->
    <script>
      try {
        /* The colour each theme's first frame must be. It is the theme's FELT,
           not its --gn-bg: since the cloth became its own surface the shell
           paints green edge to edge, and mapping this to the walnut underneath
           would flash a wood-coloured screen for one frame before the table
           arrived. Arcade has no cloth, so its felt is its background. */
        var GN_BG = { arcade: "#17111f", tabletop: "#16402c" };
        var gnTheme = localStorage.getItem("gamenight.pref.theme");
        if (gnTheme && /^[a-z][a-z0-9-]{0,23}$/.test(gnTheme)) {
          document.documentElement.dataset.theme = gnTheme;
          var gnBg = GN_BG[gnTheme] || GN_BG.arcade;
          document.documentElement.style.background = gnBg;
          var gnMeta = document.querySelector('meta[name="theme-color"]');
          if (gnMeta) gnMeta.setAttribute("content", gnBg);
        }
      } catch (e) {
        /* no storage: :root is Arcade, so there is nothing to do */
      }
    </script>
    <meta name="description" content="Run game nights with your crew: brackets, RSVPs, live scoring and TV views." />
    <!-- Standalone web app: the manifest tells the phone to launch without
         browser chrome; the apple-* tags are what iOS actually reads. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Favicons: .ico for older browsers/bookmark bars, then the 32 (downscaled
         mark) and 16 (simplified shape) PNGs. icon-192 kept as a larger fallback. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameNight" />
    <!-- Link preview (Open Graph). Absolute https URLs are required: relative
         paths fail silently in iMessage, Slack and Discord. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GameNight OS" />
    <meta property="og:title" content="GameNight OS" />
    <meta property="og:description" content="Run game nights with your crew: brackets, RSVPs, live scoring and TV views." />
    <meta property="og:url" content="https://gamenightos.app/" />
    <meta property="og:image" content="https://gamenightos.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GameNight OS: the coral GN badge with its teal underline, beside the wordmark." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GameNight OS" />
    <meta name="twitter:description" content="Run game nights with your crew: brackets, RSVPs, live scoring and TV views." />
    <meta name="twitter:image" content="https://gamenightos.app/og-image.png" />
    <!-- Fonts are self-hosted (see the @font-face block in src/index.css) and
         ride the hashed, immutably-cached CSS bundle. The render-blocking
         fonts.googleapis.com stylesheet that used to sit here cost a DNS
         lookup and a TLS handshake on a third-party origin before first
         paint, plus a second hop to fonts.gstatic.com for the files. -->
    <title>GameNight OS</title>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <!-- THE RAIL, and it lives here rather than in React on purpose.
         It is pure decoration with no state, so rendering it from a component
         would buy nothing and cost two things: it would appear a frame late,
         after hydration, which on a phone reads as the furniture arriving
         after the felt; and as a second child of #root it would break the
         invariant the safe-area rule in index.css depends on, which is that
         #root has exactly ONE child and that child is the route's shell.
         Sitting in <body> beside #root, it exists before the first paint and
         leaves that invariant alone.
         Under Arcade it draws nothing: --gn-rail-w is 0px and every colour it
         reads is transparent. An arcade cabinet has no rail. -->
    <div class="gn-rail" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
