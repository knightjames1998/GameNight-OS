# Keep-warm ping for GameNight OS.
#
# Render's free web service spins down after ~15 minutes idle, and the next
# request then pays a 30-60s cold start. This scheduled workflow sends a cheap
# GET to the health endpoint every ~13 minutes during evening game-night hours,
# so the crew never lands on a dead-looking screen on game night. Because the
# cadence (13 min) is under Render's 15-minute idle timeout, the service stays
# warm continuously across the window, then sleeps the rest of the day.
#
# Why evenings only, never blind 24/7: Render's real governor is 750 free
# instance-hours per workspace per calendar month. A 31-day month is 744 hours,
# so keeping the service awake 24/7 would sit right at the cap with no margin,
# and redeploys/rebuilds also burn hours, so a mid-month suspension is worse
# than an occasional 3am cold start (and warming at 3am buys nothing). This
# window is ~10 hours/day (~310 instance-hours/month), far under 750, leaving
# wide headroom.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP (James): add a repository VARIABLE named WARM_URL set to the
# Render ORIGIN URL, e.g. https://gamenightos.onrender.com
#   Repo -> Settings -> Secrets and variables -> Actions -> Variables tab
#   -> New repository variable -> Name: WARM_URL  Value: https://<app>.onrender.com
# Use the direct *.onrender.com origin, NOT the gamenightos.app custom domain:
# the custom domain is fronted by Cloudflare, whose cache could answer
# /api/health without the request ever reaching (and waking) the Render origin.
# The origin URL is never Cloudflare-cached, so it always hits Render and keeps
# it warm. If WARM_URL is unset, the job no-ops safely instead of failing.
#
# ---------------------------------------------------------------------------
# SCHEDULE: GitHub cron is always UTC and does NOT observe daylight saving, so
# the window is pinned in UTC below. James is Central time (America/Chicago):
#   21:00-06:59 UTC  ==  16:00-01:59 CDT (summer)  ==  15:00-00:59 CST (winter)
# i.e. it covers roughly 4pm to 1am Central year-round (an hour earlier in
# winter, still squarely in game-night hours).
#
# To WIDEN the window: add hours to the cron `hour` field below (each added
# hour is ~5 more pings/day and a little more instance-time). To SHIFT it:
# move the UTC hours (local Central = UTC minus 5 in summer, minus 6 in winter).
#
# NOTE: GitHub-scheduled cron has timing jitter and can fire several minutes
# late, or occasionally skip a slot under load. That is fine for a warm-up ping.
# NOTE: GitHub auto-disables scheduled workflows after 60 days with NO repo
# activity; any push to the repo re-enables them.

name: keep-warm

on:
  schedule:
    # minute "*/13" -> :00 :13 :26 :39 :52  (5 pings/hour, every gap < 15 min)
    # hour "21-23,0-6" -> the continuous 21:00-06:59 UTC window described above
    - cron: "*/13 21-23,0-6 * * *"
  workflow_dispatch: {} # manual "warm it now" button before a known game night

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          WARM_URL: ${{ vars.WARM_URL }}
        run: |
          if [ -z "$WARM_URL" ]; then
            echo "WARM_URL repository variable is not set; skipping (no-op)."
            echo "Set it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 0
          fi
          base="${WARM_URL%/}"   # tolerate a trailing slash so we never build //api/health
          echo "Pinging $base/api/health"
          # -f  fail on HTTP >= 400        -s  silent        -S  still show errors
          # --max-time 75 tolerates a 30-60s cold start; one retry catches a
          # timeout mid-spin-up. Fail-soft: a bad ping must not spam failure
          # emails, so we swallow the error (the next run is ~13 min away).
          if curl -fsS --connect-timeout 20 --max-time 75 --retry 1 --retry-delay 10 --retry-all-errors "$base/api/health"; then
            printf '\nwarm ok\n'
          else
            echo "ping failed (harmless; next scheduled run is ~13 min away)"
          fi
